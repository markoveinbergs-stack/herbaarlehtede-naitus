<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centaurea cyanus | Herbaarlehtede näitus</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #171c17; color: white; font: 1rem system-ui, sans-serif }
main { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; min-height: 100dvh; padding: 1.25rem }
.photo { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover }
main::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#000b, transparent 26%, transparent 68%, #000b) }
h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.2rem) }
p { margin: .4rem 0 }
footer { position: relative; pointer-events: none }
footer a, footer audio { pointer-events: auto }
a { color: white }
audio { width: min(100%, 22rem); margin-bottom: 1rem }
.back { display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; background: #0009; color: white; text-decoration: none; font-size: 1.25rem }
.language-controls { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: .75rem; padding: 1rem; pointer-events: none }
.language-controls[hidden] { display: none }
.language-controls button { pointer-events: auto; min-height: 44px; border: 0; border-radius: 2rem; background: white; color: #171c17; padding: .75rem 1rem; font: inherit; font-weight: 700; cursor: pointer }
.language-controls button:focus-visible { outline: 3px solid #171c17; outline-offset: 3px }
</style>
</head>
<body>
<main>
<img class="photo" src="../fotod/rukkilill.webp" alt="Rukkilill">
<header><h1><i>Centaurea cyanus</i></h1></header>
<div class="language-controls" hidden>
<button type="button" data-language="et">▶ Kuula eesti keeles</button>
<button type="button" data-language="en" lang="en">▶ Listen in English</button>
</div>
<footer>
<audio id="story-et" controls preload="none" src="../heli-et/rukkilill.mp3" aria-label="Eestikeelne taimejutt"></audio>
<audio id="story-en" lang="en" controls preload="none" src="../Rukkilill.mp3" aria-label="Plant story in English"></audio>
<p id="notice" role="status" hidden>Heli ei käivitunud. Proovi helimängijast uuesti.</p>
<a class="back" href="../index.html" aria-label="Tagasi taimede nimekirja">←</a>
</footer>
</main>
<script>
const controls = document.querySelector('.language-controls');
const notice = document.getElementById('notice');
const tracks = [...controls.querySelectorAll('button')].map(button => ({
  button,
  player: document.getElementById('story-' + button.dataset.language),
  playLabel: button.textContent,
  pauseLabel: button.dataset.language === 'et' ? 'Ⅱ Paus' : 'Ⅱ Pause'
}));

let latestRequest = 0;
for (const {button, player, playLabel, pauseLabel} of tracks) {
  player.hidden = true;
  function syncButton() {
    button.textContent = player.paused ? playLabel : pauseLabel;
  }
  for (const event of ['play', 'pause', 'ended']) {
    player.addEventListener(event, syncButton);
  }
  player.addEventListener('play', () => {
    for (const track of tracks) {
      if (track.player !== player) track.player.pause();
    }
  });
  button.addEventListener('click', async () => {
    const request = ++latestRequest;
    notice.hidden = true;
    if (!player.paused) {
      player.pause();
      return;
    }
    for (const track of tracks) {
      if (track.player !== player) track.player.pause();
    }
    try {
      await player.play();
    } catch {
      if (request !== latestRequest) return;
      player.hidden = false;
      notice.hidden = false;
    }
  });
}
controls.hidden = false;
</script>
</body>
</html>

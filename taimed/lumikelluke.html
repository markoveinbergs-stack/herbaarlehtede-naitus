<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harilik lumikelluke | Herbaarlehtede näitus</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #171c17; color: white; font: 1rem system-ui, sans-serif }
main { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; min-height: 100svh; padding: 1.25rem; isolation: isolate }
.photo { position: absolute; z-index: -2; width: 100%; height: 100%; object-fit: contain }
main::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#000b, transparent 28%, transparent 68%, #000b) }
h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.2rem) }
p { margin: .4rem 0 }
button { align-self: end; justify-self: center; margin: 1rem 0 12vh; border: 0; border-radius: 2rem; background: white; color: #171c17; padding: .85rem 1.35rem; font: inherit; font-weight: 700; cursor: pointer }
a { color: white }
audio { width: min(100%, 22rem); margin-bottom: 1rem }
</style>
</head>
<body>
<main>
<img class="photo" src="../fotod/lumikelluke.webp" alt="Õitsevad harilikud lumikellukesed metsa all">
<header><h1>Harilik lumikelluke</h1><p><i>Galanthus nivalis</i></p></header>
<button type="button" id="play" hidden>▶ Mängi</button>
<footer>
<audio id="story" controls preload="none" src="../Lumikelluke.mp3" aria-label="Hariliku lumikellukese taimejutt"></audio>
<p id="notice" role="status" hidden>Heli ei käivitunud. Proovi helimängijast uuesti.</p>
<p><a href="../index.html">Kõik taimejutud</a></p>
</footer>
</main>
<script>
const player = document.getElementById('story');
const button = document.getElementById('play');
const notice = document.getElementById('notice');
button.hidden = false;
player.hidden = true;
button.addEventListener('click', async () => {
  notice.hidden = true;
  if (!player.paused) {
    player.pause();
    return;
  }
  try {
    await player.play();
  } catch {
    player.hidden = false;
    notice.hidden = false;
  }
});
function syncButton() {
  button.textContent = player.paused ? '▶ Mängi' : 'Ⅱ Paus';
}
player.addEventListener('play', syncButton);
player.addEventListener('pause', syncButton);
player.addEventListener('ended', syncButton);
</script>
</body>
</html>
